# The URL the site will be built for
base_url = "https://nilenso.com"

# Site-wide defaults. Pages override these with `title` and `description` in
# their front matter; see templates/base.html.
title = "nilenso"
description = "nilenso is an employee-owned product, engineering and AI consultancy in India and Canada. We build thoughtful, well-crafted products."

[markdown.highlighting]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here

tabs = [
    {name="work",path="/work/",nav=true},
    {name="open source",path="/open-source/",nav=true},
    {name="jobs",path="/jobs/",nav=true},
    # {name="perks",path="/perks/",nav=true},
    {name="people",path="/people/",nav=true},
    {name="blog",path="https://blog.nilenso.com/",nav=true},
    {name="alumni",path="/alumni/",nav=false},
    {name="talks",path="/talks/",nav=true},
    {name="contact",path="#contact",nav=true},
]

[extra.seo]
# Path (relative to static/) of the image used for link previews on social
# platforms. Must be 1200x630. Leave empty to serve previews without an image.
og_image = ""
twitter_handle = "@nilenso"

[extra.organization]
# Used to build the Organization JSON-LD in base.html. `same_as` should list
# profiles nilenso actually controls -- search engines use them to tie the
# domain to the organisation.
logo = "images/favicon/android-chrome-512x512.png"
same_as = [
    "https://github.com/nilenso",
    "https://twitter.com/nilenso",
    "https://in.linkedin.com/company/nilenso-software-llp",
]
